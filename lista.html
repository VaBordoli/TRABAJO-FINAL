<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantalla de listas</title>
  <link rel="stylesheet" href="lista.css?v=2">
</head>
<body>
  <form id="form-agregar" class="ventana">

    <header class="barra-titulo">
      <button type="button" class="circulo" aria-label="Menú">
        <img src="img/logo.png" alt="Logo ">
      </button>
    </header>

    <div class="campo-texto">Creacion de Campos</div>

    <ul class="lista lista-izq">
      <li class="item-lista item-encabezado">
        <div class="linea">Nombre y Parcelas</div>
      </li>
      <li class="item-lista">
        <div class="marca"></div>
        <input class="linea" id="nombre-parcela" type="text" placeholder="Nombre de Campos" required>
      </li>
      <li class="item-lista">
        <div class="marca"></div>
        <input class="linea" id="nSensor" type="text" placeholder="Nombre de Sensor" required>
      </li>
    </ul>

    <ul class="lista lista-der">
      <li class="item-lista item-encabezado">
        <div class="linea">Valores Predeterminados</div>
      </li>

      <li class="item-lista">
        <div class="marca"></div>
        <div class="linea etiqueta-valor">Humedad</div>
      </li>

      <li class="item-lista">
        <input class="linea linea-mm mm-izq campo-num" id="humedad-min" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="%" data-max="100" placeholder="Valor Min." required>

        <input class="linea linea-mm mm-der campo-num" id="humedad-max" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="%" data-max="100" placeholder="Valor Max" required>
      </li>

      <li class="item-lista">
        <div class="marca"></div>
        <div class="linea etiqueta-valor">Temperatura</div>
      </li>

      <li class="item-lista">
        <input class="linea linea-mm mm-izq campo-num" id="temperatura-min" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="°C" placeholder="Valor Min." required>

        <input class="linea linea-mm mm-der campo-num" id="temperatura-max" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="°C" placeholder="Valor Max" required>
      </li>

      <li class="item-lista">
        <div class="marca"></div>
        <div class="linea etiqueta-valor">Corriente</div>
      </li>

      <li class="item-lista">
        <input class="linea linea-mm mm-izq campo-num" id="corriente-min" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="S" placeholder="Valor Min." required>

        <input class="linea linea-mm mm-der campo-num" id="corriente-max" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="S" placeholder="Valor Max" required>
      </li>
    </ul>

    <button type="submit" class="enlace-boton" aria-label="Agregar">
      <div class="boton">
        <div class="pildora"></div>
        <div class="c-pildora"></div>
      </div>
    </button>

  </form>
<script src="datos.js?v=3"></script>
  <script src="lista.js?v=4"></script>
</body>
</html>
