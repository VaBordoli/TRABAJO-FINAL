<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantalla de listas</title>
  <link rel="stylesheet" href="lista.css">
</head>
<body>
  <form id="form-agregar" class="ventana">

    <header class="barra-titulo">
      <button type="button" class="circulo" aria-label="Menú"></button>
    </header>

    <div class="campo-texto">Creacion de Campos</div>

    <ul class="lista lista-izq">
      <li class="item-lista item-encabezado">
        <div class="linea">Nombre y Parcelas</div>
      </li>
      <li class="item-lista">
        <div class="marca"></div>
        <input class="linea" id="nombre-parcela" type="text" placeholder="Nombre de Campos" required>
      </li>
      <li class="item-lista">
        <div class="marca"></div>
        <input class="linea" id="nSensor" type="text" placeholder="Nombre de Sensor">

      </li>
    </ul>

    <ul class="lista lista-der">
      <li class="item-lista item-encabezado">
        <div class="linea">Valores Predeterminados</div>
      </li>
    
      <!-- Humedad -->
      <li class="item-lista">
        <div class="marca"></div>
        <input class="linea campo-num" id="humedad" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="%" data-max="100" placeholder="Humedad">
        
      </li>
    
      <!-- Humedad mín / máx -->
      <li class="item-lista">
        <input class="linea linea-mm mm-izq campo-num" id="humedad-min" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="%" data-max="100" placeholder="Valor Min.">
        <button type="button" class="btn-mm mm-1" data-target="humedad-min" data-paso="-1" aria-label="Restar">−</button>
        <button type="button" class="btn-mm mm-2" data-target="humedad-min" data-paso="1" aria-label="Sumar">+</button>
    
        <input class="linea linea-mm mm-der campo-num" id="humedad-max" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="%" data-max="100" placeholder="Valor Max">
        <button type="button" class="btn-mm mm-3" data-target="humedad-max" data-paso="-1" aria-label="Restar">−</button>
        <button type="button" class="btn-mm mm-4" data-target="humedad-max" data-paso="1" aria-label="Sumar">+</button>
      </li>
    
      <!-- Temperatura -->
      <li class="item-lista">
        <div class="marca"></div>
        <input class="linea campo-num" id="temperatura" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="°C" placeholder="Temperatura">
        
      </li>
    
      <!-- Temperatura mín / máx -->
      <li class="item-lista">
        <input class="linea linea-mm mm-izq campo-num" id="temperatura-min" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="°C" placeholder="Valor Min.">
        <button type="button" class="btn-mm mm-1" data-target="temperatura-min" data-paso="-1" aria-label="Restar">−</button>
        <button type="button" class="btn-mm mm-2" data-target="temperatura-min" data-paso="1" aria-label="Sumar">+</button>
    
        <input class="linea linea-mm mm-der campo-num" id="temperatura-max" type="text" inputmode="numeric" autocomplete="off"
               data-sufijo="°C" placeholder="Valor Max">
        <button type="button" class="btn-mm mm-3" data-target="temperatura-max" data-paso="-1" aria-label="Restar">−</button>
        <button type="button" class="btn-mm mm-4" data-target="temperatura-max" data-paso="1" aria-label="Sumar">+</button>
      </li>
    </ul>
    <!-- Botón inferior: ahora es el que agrega -->
    <button type="submit" class="enlace-boton" aria-label="Agregar">
      <div class="boton">
        <div class="pildora"></div>
        <div class="c-pildora"></div>
      </div>
    </button>

  </form>

  <script src="lista.js"></script>
</body>
</html>
