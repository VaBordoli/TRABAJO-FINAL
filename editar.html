<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar campo</title>
  <link rel="stylesheet" href="editar.css">
</head>
<body>
  <header class="barra">
    <a class="circulo-barra" id="link-regresar" href="Home.html" title="Volver"></a>
  </header>

  <h1 class="titulo">Edición de Campos</h1>

  <form id="form-editar" class="paneles">
    <div class="contenedor-paneles">

      <!-- PANEL IZQUIERDO -->
      <section class="panel">
        <span class="punto-panel"></span>
        <h2 class="subtitulo">Nombre y Parcelas</h2>

        <div class="fila-campo">
          <span class="circulo"></span>
          <input type="text" id="nombre-parcela" class="pildora" placeholder="Nombre de Campos" required>
        </div>

        <div class="fila-campo">
          <span class="circulo"></span>
          <input type="text" id="nSensor" class="pildora" placeholder="Nombre del Sensor" readonly>
          <!-- Candado -->
          <svg class="candado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="1.5"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            <circle cx="12" cy="16" r="1" fill="currentColor"/>
          </svg>
        </div>
      </section>

      <!-- PANEL DERECHO -->
      <section class="panel">
        <span class="punto-panel"></span>
        <h2 class="subtitulo">Valores Predeterminados</h2>

        <!-- HUMEDAD -->
        <div class="fila-valor">
          <span class="circulo"></span>
          <input type="text" id="humedad" class="pildora campo-num" data-sufijo="%" data-max="100" placeholder="Humedad" inputmode="numeric">
        </div>
        <div class="par-limites">
          <div class="limite">
            <input type="text" id="humedad-min" class="pildora campo-num" data-sufijo="%" data-max="100" placeholder="Valor Min." inputmode="numeric">
            <div class="botones-mini">
              <button type="button" class="mini" data-target="humedad-min" data-paso="-1">−</button>
              <button type="button" class="mini" data-target="humedad-min" data-paso="1">+</button>
            </div>
          </div>
          <div class="limite">
            <input type="text" id="humedad-max" class="pildora campo-num" data-sufijo="%" data-max="100" placeholder="Valor Max" inputmode="numeric">
            <div class="botones-mini">
              <button type="button" class="mini" data-target="humedad-max" data-paso="-1">−</button>
              <button type="button" class="mini" data-target="humedad-max" data-paso="1">+</button>
            </div>
          </div>
        </div>

        <!-- TEMPERATURA -->
        <div class="fila-valor">
          <span class="circulo"></span>
          <input type="text" id="temperatura" class="pildora campo-num" data-sufijo="°C" placeholder="Temperatura" inputmode="numeric">
        </div>
        <div class="par-limites">
          <div class="limite">
            <input type="text" id="temperatura-min" class="pildora campo-num" data-sufijo="°C" placeholder="Valor Min." inputmode="numeric">
            <div class="botones-mini">
              <button type="button" class="mini" data-target="temperatura-min" data-paso="-1">−</button>
              <button type="button" class="mini" data-target="temperatura-min" data-paso="1">+</button>
            </div>
          </div>
          <div class="limite">
            <input type="text" id="temperatura-max" class="pildora campo-num" data-sufijo="°C" placeholder="Valor Max" inputmode="numeric">
            <div class="botones-mini">
              <button type="button" class="mini" data-target="temperatura-max" data-paso="-1">−</button>
              <button type="button" class="mini" data-target="temperatura-max" data-paso="1">+</button>
            </div>
          </div>
        </div>
      </section>

    </div>

    <div class="zona-guardar">
      <button type="submit" class="boton-guardar">
        <span class="texto-guardar">Guardar</span>
        <span class="circulo-claro"></span>
      </button>
    </div>
  </form>

  <script src="editar.js"></script>
</body>
</html>
