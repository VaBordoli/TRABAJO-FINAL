<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="perfil.css?v=3">
</head>
<body>

    <div class="ventana">

        <header class="barra-titulo">
            <button type="button" class="circulo" id="boton-circulo">
                <img src="img/logo.png" alt="Logo">
            </button>
        </header>

        <main class="contenido">
            <section class="NOSEAMIGO">
                <div class="campo-texto"> "Perfil de Usuario"</div>

                <div class="fila-perfil">
                    <input class="campo-texto" id="nombre-usuario" type="text" placeholder="Nombre Usuario" required>
                    <a href="Editar-Nombre.html">
                        <img src="img/lapiz-editar.png" alt="Editar nombre" id="nombre-editar" class="icono-editar">
                    </a>
                </div>

                <div class="fila-perfil">
                    <input class="campo-texto" id="mail-usuario" type="text" placeholder="Mail" required>
                    <a href="Editar-Mail.html">
                        <img src="img/lapiz-editar.png" alt="Editar mail" id="mail-editar" class="icono-editar">
                    </a>
                </div>

                <div class="fila-perfil">
                    <input class="campo-texto" id="contra-usuario" type="text" placeholder="Contraseña" required>
                    <a href="Editar-Contra.html">
                        <img src="img/lapiz-editar.png" alt="Editar contraseña" id="contra-editar" class="icono-editar">
                    </a>
                </div>
            </section>

            <button id="cerrar-sesion" class="sacas-p boton">
                <div class="p-b-cerrar-sesion"> Cerrar Sesion</div>
            </button>

            <!-- Botón eliminar cuenta (abre el pop-up) -->
            <button type="button" id="eliminar-cuenta" class="eliminar-cuenta sacas-p" aria-label="Eliminar cuenta">
                <img src="img/tacho.png" alt="Eliminar cuenta" id="eliminar-cuenta-icono">
            </button>

            <a href="Home.html" id="link-regresar">
                <button class="continuar sacas-p">Continuar</button>
            </a>
        </main>
    </div>

    <div class="modal-overlay" id="modal-eliminar" hidden>
        <div class="modal-caja">
            <p class="modal-consigna">Confirmar contraseña para borrar cuenta</p>

            <div class="control-contrasena-perfil">
                <input class="modal-input" id="contra-confirmar" type="password" placeholder="Contraseña" autocomplete="off">
                <button type="button" class="boton-visibilidad-perfil" id="alternar-contra-confirmar" aria-label="Mostrar contraseña" aria-pressed="false">
                    <img src="img/contrasena-oculta.png" alt="">
                </button>
            </div>

            <p class="modal-mensaje" id="mensaje-eliminar"></p>

            <div class="modal-botones">
                <button type="button" class="modal-boton" id="cancelar-eliminar">Cancelar</button>
                <button type="button" class="modal-boton" id="confirmar-eliminar">Confirmar</button>
            </div>
        </div>
    </div>
    <script src="datos.js?v=2"></script>

    <script src="perfil.js?v=2"></script>
</body>
</html>
