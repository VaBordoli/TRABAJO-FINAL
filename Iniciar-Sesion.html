<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo de ventana</title>

  <link rel="stylesheet" href="Iniciar-Sesion.css">
</head>
<body>

 
  <div class="ventana">

    <div class="barra-titulo">
      <div class="circulo ">
        <img src="img/logo.png" alt="Logo">
      </div>
    </div>

    <div class="contenido">
            

      <div class="campo-texto">Iniciar Sesion</div>
            

      <div class="columna-botones">
        
        <a class="enlace-boton">
          <div class="boton boton-superior">
            <div class="pildora">
              <input type="text" class="franquito" placeholder="Nombre de Usuario" >
            </div>
          </div>
        </a>
        
        <a  class="enlace-boton">
          <div class="boton boton-inferior">
            <div class="pildora">
              <input type="text" class="franquito" placeholder="Contraseña" >
            </div>
          </div>
        </a>
      </div>

      <a href="Home.html" class="enlace-boton-chico">
        <div class="boton-chico">Continuar</div>
      </a>

    </div>
  </div>
<script src="datos.js"></script>
  <script src="Iniciar-Sesion.js"></script>

</body>
</html>
