<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informacion</title>
    <link rel="stylesheet" href="Informacion.css">
</head>
<body>
    <div class="ventana">
        <div class="barra-titulo">
            <a href="Home.html" id="link-regresar" title="Regresar">
                <button type="button" class="circulo" aria-label="Regresar">
                              <img src="img/logo.png" alt="Logo ">
                      </header>
                 
                </button>
            </a>
        </div>

        <div class="contenido">
            <h1 id="titulo-informacion" class="campo-texto"></h1>

            <div class="zona-grafico">
                <div class="controles">
                    <div class="grupo-toggle" id="toggle-tipo">
                        <button type="button" class="opcion activa" data-tipo="temperatura">Temp°C</button>
                        <button type="button" class="opcion" data-tipo="humedad">Hum %</button>
                    </div>

                    <div class="grupo-toggle" id="toggle-rango">
                        <button type="button" class="opcion activa" data-rango="24h">24 Horas</button>
                        <button type="button" class="opcion" data-rango="7d">7 Días</button>
                    </div>
                </div>

                <div class="grafico-caja">
                    <svg id="grafico" viewBox="0 0 1000 430" role="img" aria-label="Gráfico de línea"></svg>
                    <p id="mensaje-grafico" class="mensaje" hidden></p>
                </div>
            </div>
        </div>
    </div>

    <script src="Informacion.js"></script>
</body>
</html>
