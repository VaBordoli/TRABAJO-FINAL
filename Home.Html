<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla de listas</title>
  <link rel="stylesheet" href="Home.css">
</head>
<body>

  <div class="ventana">

    <header class="barra-titulo">
      <button type="button" class="circulo" id="boton-circulo"></button>
    </header>

    <main class="contenido">

      <div class="campo-texto"></div>

      <section class="fila-listas">

        <article class="columna columna-grande">

          <ul class="lista lista-grande">
            
          </ul>

          <nav class="fila-botones">
            <button type="button" class="enlace-boton">
              <div class="boton">
                <div class="pildora">
                  Eliminar
                </div>
                <div class="c-pildora">
                 
                </div>
              </div>
            </button>
            <button type="button" class="enlace-boton">
              <div class="boton">
                <div class="pildora">
                  Informacion
                </div>
                <div class="c-pildora">
                 
                </div>
              </div>
            </button>
            <button type="button" class="enlace-boton">
              <div class="boton">
                <div class="pildora">
                  Editar
                </div>
                <div class="c-pildora">
            
                </div>
              </div>
            </button>
            <button type="button" class="enlace-boton" id="boton-agregar">
              <div class="boton">
                <div class="pildora">
                  Agregar
                </div>
                <div class="c-pildora">
                  
                </div>
              </div>
            </button>
          </nav>

        </article>

        <article class="columna columna-chica">

          <ul class="lista lista-chica">
            <li class="item-lista item-encabezado">
              <input class="linea" readonly>
            </li>
            <li class="item-lista">
              <div class="marca"></div>
              <input class="linea" readonly>
            </li>
            <li class="item-lista">
              <div class="marca"></div>
              <input class="linea" readonly>
            </li>
            <li class="item-lista">
              <div class="marca"></div>
              <input class="linea" readonly>
            </li>
            <li class="item-lista">
              <div class="marca"></div>
              <input class="linea" readonly>
            </li>
            <li class="item-lista">
              <div class="marca"></div>
              <input class="linea" readonly>
            </li>
          </ul>

        </article>

      </section>

    </main>
  </div>

  <script src="Home.js"></script>

</body>
</html>
