<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla de listas</title>
  <link rel="stylesheet" href="Home.css?v=2">
</head>
<body>

  <div class="ventana">

    <header class="barra-titulo">
      <button type="button" class="circulo" id="boton-circulo">
            <img src="img/logo.png" alt="Logo ">
        
    
      </button>
    </header>


    <main class="contenido">

      <div class="campo-texto"> Bienvenido a Earth-Grid</div>

      <section class="fila-listas">

        <article class="columna columna-grande">

          <ul class="lista lista-grande">
            
          </ul>

          <nav class="fila-botones">
            <button type="button" class="enlace-boton">
              <div class="boton">
                <div class="pildora">
                  Eliminar
                </div>
                <div class="c-pildora">
                 
                </div>
              </div>
            </button>
            <button type="button" class="enlace-boton">
              <div class="boton">
                <div class="pildora">
                  Informacion
                </div>
                <div class="c-pildora">
                 
                </div>
              </div>
            </button>
            <button type="button" class="enlace-boton">
              <div class="boton">
                <div class="pildora">
                  Editar
                </div>
                <div class="c-pildora">
            
                </div>
              </div>
            </button>
            <button type="button" class="enlace-boton" id="boton-agregar">
              <div class="boton">
                <div class="pildora">
                  Agregar
                </div>
                <div class="c-pildora">
                  
                </div>
              </div>
            </button>
          </nav>

        </article>

        <article class="columna columna-chica">

          <ul class="lista lista-chica">
            <li class="item-lista item-encabezado">
              <div class="linea facu"> Panel de Notificaciones</div> 
            </li>
            <li class="item-lista">
              <div class="marca"></div>
              <input class="linea" readonly>
            </li>
            <li class="item-lista">
              <div class="marca"></div>
              <input class="linea" readonly>
            </li>
            <li class="item-lista">
              <div class="marca"></div>
              <input class="linea" readonly>
            </li>
            <li class="item-lista">
              <div class="marca"></div>
              <input class="linea" readonly>
            </li>
            <li class="item-lista">
              <div class="marca"></div>
              <input class="linea" readonly>
            </li>
          </ul>

        </article>

      </section>

    </main>
  </div>

  <div class="modal-notificacion-overlay" id="modal-notificacion" hidden>
    <section class="modal-notificacion" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-notificacion">
      <header class="encabezado-modal-notificacion">
        <h2 id="titulo-modal-notificacion">Detalle de notificación</h2>
        <button type="button" class="cerrar-modal-notificacion" id="cerrar-modal-notificacion" aria-label="Cerrar">×</button>
      </header>
      <dl class="datos-notificacion" id="datos-notificacion"></dl>
      <button type="button" class="boton-cerrar-notificacion" id="boton-cerrar-notificacion">Cerrar</button>
    </section>
  </div>

  <script src="datos.js"></script>
  <script src="Home.js?v=3"></script>

</body>
</html>
